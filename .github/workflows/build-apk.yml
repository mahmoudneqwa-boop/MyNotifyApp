name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Generate TWA Config & Build APK
        run: |
          npx @bubblewrap/cli init --manifest=./manifest.json --skipConfig
          npx @bubblewrap/cli build --skipKeytool

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlarmApp-APK
          path: '*.apk'
