name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Web Assets Directory
        run: |
          mkdir dist
          cp -r index.html manifest.json *.js *.css *.png *.jpg dist/ 2>/dev/null || cp -r * dist/ 2>/dev/null || true
          rm -rf dist/dist dist/.git dist/.github

      - name: Initialize NPM & Install Capacitor Packages
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets --save-dev

      - name: Build Web & Package App
        run: |
          npx cap init "My Notify App" com.mynotify.app --web-dir dist
          npx cap add android

      # -------------------------------------------------------------
      # خطوة توليد أيقونات التطبيق تلقائياً من صورة iconf.png
      # -------------------------------------------------------------
      - name: Generate App Icons
        run: |
          mkdir -p assets
          cp iconf.png assets/icon.png 2>/dev/null || cp dist/iconf.png assets/icon.png 2>/dev/null || true
          cp iconf.png assets/icon-only.png 2>/dev/null || cp dist/iconf.png assets/icon-only.png 2>/dev/null || true
          cp iconf.png assets/icon-foreground.png 2>/dev/null || cp dist/iconf.png assets/icon-foreground.png 2>/dev/null || true
          cp iconf.png assets/icon-background.png 2>/dev/null || cp dist/iconf.png assets/icon-background.png 2>/dev/null || true
          npx capacitor-assets generate --android

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Fix Duplicate Kotlin Class Dependencies
        run: |
          echo '
          subprojects {
              configurations.all {
                  resolutionStrategy.eachDependency { DependencyResolveDetails details ->
                      if (details.requested.group == "org.jetbrains.kotlin") {
                          if (details.requested.name == "kotlin-stdlib-jdk7" || details.requested.name == "kotlin-stdlib-jdk8") {
                              details.useTarget("org.jetbrains.kotlin:kotlin-stdlib:${details.requested.version}")
                          }
                      }
                  }
              }
          }
          ' >> android/build.gradle

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlarmApp-APK
          path: 'android/app/build/outputs/apk/debug/*.apk'
